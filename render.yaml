services:
  - type: web
    name: binance-trading-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PAPER_TRADING
        value: "False"
      - key: USE_TESTNET
        value: "False"
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_SECRET_KEY
        sync: false
